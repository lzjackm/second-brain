<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Design system (Nov 13 refresh): Radix Mauve neutrals (warm, low-saturation grey) and one Iris accent.
   Elevation by lighter surfaces, not shadows. Accent only for: the primary action, focus, unread, the active item, links. */
:root, [data-theme="dark"] {
  --bg: #121113; --rail: #121113; --surface: #1a191b; --raised: #232225; --raised-2: #2b292d;
  --hover: rgba(255,255,255,.045); --select: rgba(255,255,255,.08); --line: rgba(255,255,255,.07); --line-soft: rgba(255,255,255,.045); --line-strong: rgba(255,255,255,.11); --line-hover: rgba(255,255,255,.17);
  --ink: #eeeef0; --ink-2: #b5b2bc; --ink-3: #7c7a85; --ink-4: #4f4c56;
  --accent: #5b5bd6; --accent-hover: #6e6ade; --accent-ink: #b1a9ff; --accent-bg: #202248;
  --primary: #5b5bd6; --primary-hover: #6e6ade; --on-primary: #ffffff;
  --link: #b1a9ff; --link-hover: #cdc7ff;
  --ok: #3dd68c; --ok-bg: #132d21; --warn: #ffca16; --warn-bg: #302008; --bad: #ff9592; --bad-bg: #3b1219; --info: #70b8ff; --info-bg: #0d2847;
  --field: rgba(255,255,255,.035); --field-hover: rgba(255,255,255,.055); --focus: #5b5bd6; --ring: #5b5bd6; --mine: #2b292d;
  --shadow: 0 16px 48px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
}
[data-theme="light"] {
  --bg: #fdfcfd; --rail: #f8f7f9; --surface: #ffffff; --raised: #ffffff; --raised-2: #f2eff3;
  --hover: rgba(0,0,0,.035); --select: rgba(0,0,0,.06); --line: rgba(0,0,0,.075); --line-soft: rgba(0,0,0,.05); --line-strong: rgba(0,0,0,.11); --line-hover: rgba(0,0,0,.18);
  --ink: #211f26; --ink-2: #65636d; --ink-3: #8e8c99; --ink-4: #c8c7d1;
  --accent: #5b5bd6; --accent-hover: #5151cd; --accent-ink: #5753c6; --accent-bg: #f0f1fe;
  --primary: #5b5bd6; --primary-hover: #5151cd; --on-primary: #ffffff;
  --link: #5753c6; --link-hover: #3e3a9e;
  --ok: #218358; --ok-bg: #e6f6eb; --warn: #ab6400; --warn-bg: #fff7c2; --bad: #ce2c31; --bad-bg: #feebec; --info: #0d74ce; --info-bg: #e6f4fe;
  --field: rgba(0,0,0,.025); --field-hover: rgba(0,0,0,.045); --focus: #5b5bd6; --ring: #5b5bd6; --mine: #f2eff3;
  --shadow: 0 16px 48px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.08);
}
:root { color-scheme: dark; } [data-theme="light"] { color-scheme: light; }
:root { --r: 8px; --r-sm: 6px; --r-lg: 12px; --font: 'Inter', -apple-system, system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --ease: 100ms ease-out; --spring: cubic-bezier(.16,1,.3,1); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/20px var(--font); letter-spacing: -0.003em; -webkit-font-smoothing: antialiased; font-optical-sizing: auto; font-feature-settings: "cv11", "ss01"; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ring); }
textarea:focus-visible, input:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } }
a { color: var(--link); text-decoration: none; } a:hover { color: var(--link-hover); }
svg.i { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink-3); } .soft { color: var(--ink-2); }
kbd { font: 500 11px/1 var(--font); color: var(--ink-3); background: var(--raised-2); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; min-width: 18px; text-align: center; display: inline-block; }

.shell { display: grid; grid-template-columns: var(--rail-w, 224px) 372px 1fr; height: 100vh; transition: padding-right 220ms ease; }
.shell.wide { grid-template-columns: var(--rail-w) 1fr; } .shell.wide #list { display: none; }
.shell.slim:not(.wide) { grid-template-columns: var(--rail-w) 280px 1fr; }
body.chat-open .shell:not(.wide) { grid-template-columns: var(--rail-w) 300px 1fr; }  /* squash, never hide: the list and item stay usable beside the drawer */
body.chat-open .shell { padding-right: 420px; }

/* Rail */
#rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; gap: 20px; overflow-y: auto; }
.wordmark { padding: 0 2px 0 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: center; }
.cmdk { display: flex; align-items: center; gap: 8px; margin: 0 2px; padding: 7px 10px; border-radius: var(--r); background: var(--field); border: 1px solid var(--line); color: var(--ink-3); cursor: pointer; transition: background var(--ease); }
.cmdk:hover { background: var(--field-hover); } .cmdk span { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .btn.ghost kbd { display: none; }  /* hidden kbd hints still took their width and pushed the menu onto a second line */
body.chat-open .bar .btn.ghost kbd { display: none; }
.group { display: flex; flex-direction: column; gap: 1px; }
.glabel { padding: 0 10px 6px; color: var(--ink-3); font-size: 12px; font-weight: 500; }
.nav { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--r-sm); border: 0; background: transparent; color: var(--ink-2); cursor: pointer; text-align: left; transition: background var(--ease), color var(--ease); }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav.on { background: var(--select); color: var(--ink); font-weight: 500; }
.nav .lbl { flex: 1; } .nav .n { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav.on .n.hot { color: var(--ink); }
.foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 10px; }
.today { display: flex; align-items: center; gap: 10px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); flex: none; }
.dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .45 } to { opacity: 1 } }

/* List */
#list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.lhead { padding: 20px 16px 10px; display: flex; flex-direction: column; gap: 12px; }
.lhead .t { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; }
.lhead .t .c { font-size: 13px; font-weight: 400; color: var(--ink-3); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; transition: background var(--ease), color var(--ease), border-color var(--ease); }
.chip:hover { background: var(--hover); color: var(--ink); } .chip.on { background: var(--select); border-color: var(--line-strong); color: var(--ink); }
#rows { overflow-y: auto; flex: 1; padding: 4px 8px 16px; }
.row { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 11px 12px 11px 18px; border-radius: var(--r); cursor: pointer; transition: background var(--ease), opacity 220ms, transform 220ms, max-height 260ms, padding 260ms; max-height: 220px; overflow: hidden; }
.row::before { content: ""; position: absolute; left: 6px; top: 13px; bottom: 13px; width: 3px; border-radius: 2px; background: transparent; }
.row.p-hot::before { background: var(--bad); }
.row:hover { background: var(--hover); } .row.sel { background: var(--select); }
.row .title { font-weight: 500; line-height: 1.35; padding-right: 14px; }
.row .next { font-size: 13px; color: var(--ink-2); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 12px; color: var(--ink-3); }
.row .unread { position: absolute; top: 15px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--info); }
.row.leaving { opacity: 0; transform: translateX(24px); max-height: 0; padding-top: 0; padding-bottom: 0; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 18px; background: var(--select); color: var(--ink-2); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.info { background: var(--info-bg); color: var(--info); }
.tag.cat { background: transparent; border: 1px solid var(--line); color: var(--ink-2); } .tag.cat::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--ink-3); }
.tag.cat.info::before { background: var(--info); } .tag.cat.warn::before { background: var(--warn); } .tag.cat.ok::before { background: var(--ok); }

.empty { margin: 72px auto; max-width: 300px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--ink-2); }
.empty .big { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: flex; align-items: center; justify-content: center; animation: pop 420ms cubic-bezier(.2,1.6,.4,1); }
.empty .big svg.i { width: 26px; height: 26px; stroke-width: 2.25; }
.empty .h { font-size: 17px; font-weight: 600; color: var(--ink); }
@keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }

/* Detail */
#detail { overflow-y: auto; min-width: 0; }
.focus { max-width: 760px; margin: 0 auto; padding: 18px 32px 64px; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.grow { flex: 1; }
.iconbtn { position: relative; border: 0; background: transparent; color: var(--ink-2); width: 32px; height: 32px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--ease), color var(--ease); flex: none; }
.iconbtn:hover, .iconbtn[data-open] { background: var(--hover); color: var(--ink); }
.ttl { font-size: 24px; line-height: 1.25; font-weight: 600; letter-spacing: -0.022em; margin: 0; }
.ctx { font-size: 15px; color: var(--ink-2); margin-top: 8px; white-space: pre-wrap; }
.rec { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.rec .lbl { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-bottom: 2px; }
.rec .txt { font-size: 15px; line-height: 1.45; }
.rec svg.i { margin-top: 2px; color: var(--ink-3); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card.cur { border-color: var(--line-strong); }
.chead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.chead .k { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.stitle { padding: 6px 16px 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.sline { padding: 4px 16px 0; font-size: 13px; color: var(--ink-2); }
.sline.bad { color: var(--bad); }
.cbody { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
textarea, input.text { width: 100%; border-radius: var(--r); background: var(--field); border: 1px solid var(--line); padding: 10px 12px; line-height: 1.5; resize: vertical; transition: background var(--ease), border-color var(--ease); }
textarea:hover, input.text:hover { background: var(--field-hover); }
textarea:focus, input.text:focus { outline: none; border-color: var(--focus); background: var(--field-hover); }
textarea::placeholder, input.text::placeholder { color: var(--ink-3); }
.draft { min-height: 96px; resize: none; overflow: hidden; }
.target { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.srcline { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; } .srcline a { color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; } .srcline a:hover { color: var(--ink); } .srcline.bad { color: var(--bad); }
.src { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src:hover { color: var(--ink); border-color: var(--ink-3); }
.checkline { display: flex; gap: 8px; align-items: flex-start; margin: 6px 16px 0; padding: 6px 10px; border-radius: 6px; font-size: 13px; line-height: 18px; }
.checkline.block { background: var(--bad-bg); color: var(--bad); } .checkline.warn { background: var(--warn-bg); color: var(--warn); }
.checkline.one span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.details .v { min-width: 0; }
.checkline svg { flex: none; width: 14px; height: 14px; margin-top: 2px; }
.conflicts { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.conflicts .ct { color: var(--ink); } .conflicts .lbl { color: var(--ink-3); margin-right: 4px; } .conflicts .soft { color: var(--ink-3); font-size: 13px; }
body.chat-open.talk-wide .shell { padding-right: 560px; } body.talk-wide #drawer { width: 560px; }
@media (max-width: 1440px) { body.chat-open.talk-wide .shell { padding-right: 480px; } body.talk-wide #drawer { width: 480px; } body.chat-open .shell:not(.wide) { grid-template-columns: var(--rail-w) 260px 1fr; } }
.dbd.talk { display: flex; flex-direction: column; gap: 18px; }
.tmsg.me { display: flex; justify-content: flex-end; } .tmsg.me .tb { max-width: 82%; background: var(--mine); border-radius: 14px; padding: 9px 13px; }
.tmsg.me .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; font-size: 14px; } .tlbl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.tmsg.ag { display: flex; gap: 10px; align-items: flex-start; } .tmsg.ag .tbody { flex: 1; min-width: 0; } .tav { flex: none; padding-top: 2px; }
.tmsg.ag .md { font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; } .tmsg.ag .md > :first-child { margin-top: 0; } .tmsg.ag .md > :last-child { margin-bottom: 0; }
.tmsg.ag .md table { font-size: 13px; } .tmeta { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
.rcard { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.rcard .rhd { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: transparent; border: 0; color: var(--ink); cursor: pointer; font: inherit; font-size: 14px; text-align: left; }
.rcard .rhd:hover { background: var(--hover); }
.think { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; } .tstate { color: var(--info); }
.linkbtn { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font: inherit; font-size: 12.5px; text-decoration: underline; padding: 0; }
#compose { resize: vertical; }
.live { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-3); }
.live .who { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; margin-bottom: 2px; }
.live .ln { font-family: var(--mono, ui-monospace, monospace); white-space: pre-wrap; word-break: break-word; } .live .ln.text { color: var(--ink-2); font-family: inherit; }
.vote { display: inline-flex; gap: 2px; margin-right: 8px; }
.vbtn { border: 0; background: transparent; color: var(--ink-3); width: 26px; height: 26px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--ease), color var(--ease); }
.vbtn:hover { background: var(--hover); color: var(--ink); }
.vbtn.on { color: var(--ok); } .vbtn.on.bad { color: var(--bad); }
.vbtn svg.i { width: 15px; height: 15px; }
.why { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); line-height: 1.45; } .why svg.i { margin-top: 2px; color: var(--ink-3); }
.btn .to { font-weight: 400; opacity: .7; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.cur .cbody { container-type: inline-size; }
@container (max-width: 640px) { .bar .btn.ghost:not(.keep) .lbl { display: none; } .bar .btn.ghost { padding: 0 9px; } }
.bar .iconbtn { flex-shrink: 0; }
.bar > * { flex-shrink: 0; }  /* icons and the menu never shrink; only the link label below does */
.bar .btn.keep { flex: 0 1 auto; min-width: 0; overflow: hidden; } .bar .btn.keep .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; min-width: 0; } .bar .btn.ghost { padding: 0 10px; } .bar .btn.primary { margin-right: 6px; }
.btn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: var(--r); border: 1px solid transparent; background: transparent; color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background var(--ease), border-color var(--ease), transform 80ms; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--on-primary); } .btn.primary:hover { background: var(--primary-hover); }
.btn.primary kbd { background: transparent; border-color: color-mix(in srgb, var(--on-primary) 25%, transparent); color: color-mix(in srgb, var(--on-primary) 60%, transparent); }
.btn.ghost { color: var(--ink-2); } .btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.line { border-color: var(--line-strong); } .btn.line:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.badge-dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--info); box-shadow: 0 0 0 2px var(--surface); }

.upcoming { display: flex; flex-direction: column; margin-top: 8px; }
.up { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line-soft); font-size: 14px; color: var(--ink-2); }
.up.done { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-4); }
.check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink-4); flex: none; display: flex; align-items: center; justify-content: center; }
.check.done { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.check.done svg.i { width: 10px; height: 10px; stroke-width: 3; }
.av { width: 22px; height: 22px; border-radius: 50%; font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; letter-spacing: 0; }
.av.me { background: var(--primary); color: var(--on-primary); } .av.bot { background: var(--raised-2); color: var(--ink-2); border: 1px solid var(--line-strong); }
.av.bot svg.i { width: 12px; height: 12px; }

.chatpill { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; text-align: left; transition: background var(--ease); }
.chatpill:hover { background: var(--hover); color: var(--ink); }
.chatpill .last { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* Chat drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; z-index: 30; background: var(--raised); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.25); display: flex; flex-direction: column; transform: translateX(100%); transition: transform 220ms cubic-bezier(.2,.7,.2,1); }
body.chat-open #drawer { transform: none; }
body:not(.chat-open) #drawer { box-shadow: none; visibility: hidden; transition: transform 220ms cubic-bezier(.2,.7,.2,1), visibility 0s 220ms; }
.dhd { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 18px; border-bottom: 1px solid var(--line); }
.dbd { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.dft { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dft textarea { min-height: 64px; max-height: 200px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.me { flex-direction: row-reverse; }
.bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.msg.me .bubble { background: var(--mine); border-color: transparent; }
.bubble .who { font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }

.dots { display: inline-flex; gap: 3px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); animation: bounce 900ms infinite; } .dots i:nth-child(2) { animation-delay: 150ms; } .dots i:nth-child(3) { animation-delay: 300ms; }

/* Menus, palette, dialogs, toast */

.mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: transparent; border-radius: var(--r-sm); cursor: pointer; text-align: left; color: var(--ink); }
.mi:hover, .mi.on { background: var(--hover); } .mi .lbl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } .mi.bad { color: var(--bad); }
.msep { height: 1px; background: var(--line); margin: 6px 4px; }

.dialog { width: 520px; max-width: 100%; background: var(--raised); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: drop 140ms ease-out; }
.dialog .h { font-size: 16px; font-weight: 600; } .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.report { width: min(1100px, calc(100vw - 64px)); height: calc(100vh - 64px); max-height: none; overflow-y: auto; padding: 28px 40px 40px; }
.report .rtop { position: sticky; top: -28px; margin: -28px -40px 16px; padding: 16px 40px; background: var(--raised); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; z-index: 1; }
#report.overlay { align-items: center; padding: 32px; }
.report #report-body { font-size: 15.5px; line-height: 1.65; max-width: 860px; margin: 0 auto; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 16px); opacity: 0; background: var(--primary); color: var(--on-primary); padding: 9px 14px; border-radius: 999px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); transition: all 200ms ease-out; z-index: 60; pointer-events: none; }
#toast.show { transform: translate(-50%, 0); opacity: 1; } #toast.bad { background: var(--bad-bg); color: var(--bad); }

.rate { width: 28px; height: 28px; }
.rate.on.up { color: var(--ok); background: var(--ok-bg); } .rate.on.down { color: var(--bad); background: var(--bad-bg); }
.fblist { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.fbitem { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
.page { max-width: 820px; margin: 0 auto; padding: 36px 32px 64px; display: flex; flex-direction: column; gap: 20px; }
.page .h { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.md h2 { font-size: 17px; font-weight: 600; margin: 28px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.md h1 { display: none; } .md p { margin: 10px 0; color: var(--ink-2); } .md ul, .md ol { padding-left: 20px; margin: 8px 0; } .md li { margin: 6px 0; } .md li::marker { color: var(--ink-4); }
.md strong { font-weight: 600; } .md table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; } .md th, .md td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); } .md th { color: var(--ink-3); font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.hood { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 16px; } .hood[open] > * + * { margin-top: 16px; }
.hood summary { cursor: pointer; color: var(--ink-2); font-weight: 500; list-style: none; } .hood summary::before { content: "▸ "; color: var(--ink-3); } .hood[open] summary::before { content: "▾ "; }
.today-line { font-size: 15px; color: var(--ink-2); } .today-line b { color: var(--ink); font-weight: 600; }

/* learn */
.teach { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 16px; }
.teach input { flex: 1; border: 0; background: transparent; font-size: 16px; padding: 8px 0; color: var(--ink); outline: none; }
.teach label { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; white-space: nowrap; cursor: pointer; }
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.ccard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; color: var(--ink); transition: border-color var(--ease), transform 120ms; }
.ccard:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.ccard .t { font-weight: 600; font-size: 15px; } .ccard .sum { font-size: 13px; color: var(--ink-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ccard .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.pbar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; } .pbar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width 400ms; }
.minibars { display: flex; gap: 3px; } .minibars i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); } .minibars i.l1 { background: color-mix(in srgb, var(--ok) 25%, var(--line)); } .minibars i.l2 { background: color-mix(in srgb, var(--ok) 45%, var(--line)); } .minibars i.l3 { background: color-mix(in srgb, var(--ok) 65%, var(--line)); } .minibars i.l4 { background: color-mix(in srgb, var(--ok) 85%, var(--line)); } .minibars i.l5 { background: var(--ok); }
.tag.due { background: var(--warn-bg); color: var(--warn); } .tag.mastered { background: var(--ok-bg); color: var(--ok); }
.lpage { max-width: 1100px; height: 100vh; box-sizing: border-box; padding-bottom: 20px; }
.ltop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lsess { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; flex: 1; min-height: 0; }
.lconv { display: flex; flex-direction: column; min-height: 0; }
#lmsgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; padding: 4px 4px 12px 0; }
#lhist { display: flex; flex-direction: column; gap: 14px; }
.lconv .bubble { max-width: 92%; } .lconv .bubble .text p { margin: 0 0 8px; } .lconv .bubble .text p:last-child { margin: 0; }
.lconv .bubble .src { margin-top: 6px; font-size: 12px; color: var(--ink-3); } .lconv .bubble .src a { color: var(--ink-3); }
.lconv .msg.err .bubble { border-color: var(--bad); }
.lcomp { flex: none; border-top: 1px solid var(--line); padding: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
.lcomp textarea { min-height: 44px; max-height: 200px; resize: none; overflow-y: auto; }
.lside { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.smap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.srow { display: flex; flex-direction: column; gap: 5px; } .srow .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; } .srow .lv { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.segs { display: flex; gap: 3px; } .segs i { flex: 1; height: 6px; border-radius: 2px; background: var(--line); } .segs i.on { background: var(--ok); } .segs i.tgt { box-shadow: inset 0 0 0 1px var(--line-strong); }
.lnotes { font-size: 13px; } .lnotes h2 { font-size: 14px; margin: 16px 0 6px; padding-bottom: 4px; }
@media (max-width: 900px) { .lpage { height: auto; } .lsess { grid-template-columns: 1fr; } .lside { order: -1; } #lmsgs { max-height: 60vh; } }
/* architect */
.askbox { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.askbox textarea { border: 0; background: transparent; padding: 4px; resize: vertical; } .askbox textarea:focus { background: transparent; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; } .seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; } .seg button.on { background: var(--select); color: var(--ink); }
.card.mtg { padding: 0; width: 100%; box-sizing: border-box; } .mtg-rep { font-size: 14px; } .agenda { display: flex; flex-direction: column; gap: 2px; } .ag { border-radius: var(--r); padding: 8px 10px; } .ag.open { background: var(--hover); } .ag-head { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: baseline; width: 100%; box-sizing: border-box; } .ag-rank { color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 16px; } .ag-title { flex: 1; } .ag-owner { font-size: 12px; color: var(--ink-3); padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 999px; white-space: nowrap; } .ag-sub { font-size: 13px; color: var(--ink-3); padding-left: 26px; } .ag-more { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 4px 26px; font-size: 14px; } .ag-more .lbl, .ag-general .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin-right: 6px; } .ag-note { display: flex; gap: 8px; align-items: flex-end; } .ag-note textarea { flex: 1; resize: vertical; font: inherit; font-size: 13px; background: transparent; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 6px 8px; } .ag-notes { margin: 0; padding-left: 18px; font-size: 13px; } .ag-general { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-top: 1px solid var(--line-soft); margin-top: 6px; }
.mtg-step { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.alist { display: flex; flex-direction: column; gap: 2px; } .arow { text-align: left; border: 0; background: transparent; color: var(--ink); padding: 10px 12px; border-radius: var(--r); cursor: pointer; display: flex; flex-direction: column; gap: 4px; } .arow:hover { background: var(--hover); }
.arow .aq { font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .arow .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); }
.aturn { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }
.acard .ans { font-size: 15px; } .acard .ans p { color: var(--ink); } .acard .ans.plain { white-space: pre-wrap; line-height: 1.55; color: var(--ink); }
.qcov { display: flex; flex-wrap: wrap; gap: 6px; }
.inote { border-left: 2px solid var(--line-strong); padding: 2px 0 2px 12px; font-size: 13px; color: var(--ink-2); } .inote .lbl { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-bottom: 4px; }
.inote.warn { border-left-color: var(--warn); } .inote.bad { border-left-color: var(--bad); } .inote ul { margin: 4px 0; padding-left: 18px; } .inote p { margin: 4px 0; }
.claim { padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.claim .src { font-size: 12px; color: var(--ink-2); } .claim .quote { color: var(--ink-3); font-style: italic; margin-top: 2px; }
.steps { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--ink-3); font-family: var(--mono); } .steps li { margin: 2px 0; }
@media (max-width: 1280px) { body.chat-open .shell { padding-right: 380px; } #drawer { width: 380px; } body.chat-open .shell:not(.wide) { grid-template-columns: 0 240px 1fr; } body.chat-open #rail { display: none; } body.chat-open .shell:not(.wide) #list { grid-column: 2; } body.chat-open .shell:not(.wide) #detail { grid-column: 3; } }
@media (max-width: 1100px) { .shell { grid-template-columns: var(--rail-w) 320px 1fr; } .focus { padding: 16px 20px 48px; } }
@media (max-width: 760px) {
  .shell, .shell.wide { grid-template-columns: 1fr; height: auto; }
  #rail { border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; } .group { flex-direction: row; flex-wrap: wrap; } .glabel { display: none; } .foot { margin-top: 0; }
  #list { border-right: 0; max-height: 50vh; } .focus, .page { padding: 16px; } #drawer { width: 100%; }
}

/* ======================= Nov 13 refresh: components ======================= */
/* Numbers line up */
.nav .n, .row .meta, .tag, kbd, .stat .v, .tmeta, .today-line { font-variant-numeric: tabular-nums; }
svg.i { stroke-width: 1.6; }

/* Shell: sidebar and list sit on the base; the reading pane is one step lighter */
:root { --rail-w: 224px; }  /* one sidebar width in every layout */
.shell { grid-template-columns: var(--rail-w) 372px 1fr; }
#rail { background: var(--rail); border-right: 1px solid var(--line); padding: 14px 10px 12px; gap: 18px; }
#list { background: var(--bg); border-right: 1px solid var(--line); }
#detail { background: var(--surface); }

/* Sidebar: dimmer than content; 28px items */
.wordmark { padding: 2px 4px 0 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.012em; }
.wordmark .iconbtn { width: 28px; height: 28px; color: var(--ink-3); }
.cmdk { padding: 5px 8px; margin: 0; border-radius: var(--r-sm); background: transparent; border: 1px solid var(--line); color: var(--ink-3); font-size: 13px; }
.cmdk:hover { background: var(--hover); border-color: var(--line-strong); }
.group { gap: 1px; }
.glabel { padding: 0 8px 4px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.nav { height: 28px; padding: 0 8px; gap: 8px; color: var(--ink-2); font-size: 13px; border-radius: var(--r-sm); position: relative; }
.nav svg.i { width: 15px; height: 15px; color: var(--ink-3); }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav.on { background: var(--select); color: var(--ink); font-weight: 500; }
.nav.on svg.i { color: var(--ink); }
.nav .n { font-size: 12px; color: var(--ink-3); }
.nav.on .n.hot, .nav .n.hot { color: var(--accent-ink); font-weight: 500; }
.foot { padding: 0 8px; gap: 8px; }
.status { font-size: 12px; color: var(--ink-3); }

/* List pane */
.lhead { padding: 18px 16px 8px; gap: 10px; }
.lhead .t { font-size: 15px; font-weight: 600; letter-spacing: -0.009em; }
.lhead .t .c { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.chips { gap: 2px; }
.chip { border: 0; border-radius: var(--r-sm); padding: 2px 8px; font-size: 12px; font-weight: 500; color: var(--ink-3); background: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-bg); cursor: default; }
.chip:hover { color: var(--ink); background: var(--hover); }
.chip.on { background: var(--select); color: var(--ink); border: 0; }
#rows { padding: 2px 8px 16px; }
.row { padding: 9px 12px 9px 16px; gap: 2px; border-radius: var(--r-sm); }
.row::before { left: 4px; top: 10px; bottom: 10px; width: 2px; }
.row.p-hot::before { background: var(--bad); }
.row:hover { background: var(--hover); }
.row.sel { background: var(--select); }
.row.sel::before { background: var(--accent); }
.row .title { font-size: 13px; font-weight: 500; line-height: 20px; color: var(--ink); }
.row .next { font-size: 13px; line-height: 20px; color: var(--ink-3); -webkit-line-clamp: 1; }
.row .meta { margin-top: 2px; gap: 10px; font-size: 12px; }
.row .unread { top: 15px; right: 12px; width: 6px; height: 6px; background: var(--accent); }

/* Tags: a dot and grey text; colour only when it needs attention */
.tag { padding: 0; background: transparent; color: var(--ink-3); font-size: 12px; font-weight: 500; line-height: 18px; border-radius: 4px; }
.tag.cat { border: 0; padding: 0; color: var(--ink-3); }
.tag.cat::before { width: 6px; height: 6px; }
.tag.warn { background: transparent; color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); padding: 0 6px; }
.tag.ok { background: transparent; color: var(--ok); } .tag.info { background: transparent; color: var(--info); }
.tag.due.warn, .tag.warn.fill { background: var(--warn-bg); padding: 0 6px; }

/* Reading pane: one boxed thing (the current step); everything else is space and hairlines */
.focus { max-width: 720px; padding: 20px 40px 72px; gap: 24px; }
.topbar { min-height: 28px; gap: 10px; }
.topbar .btn.sm { color: var(--ink-3); }
.ttl { font-size: 21px; line-height: 28px; font-weight: 600; letter-spacing: -0.019em; }
.ctx { font-size: 14px; line-height: 22px; color: var(--ink-2); margin-top: 6px; }
.srcline { margin-top: 10px; font-size: 12px; gap: 6px; }
.src { padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; color: var(--ink-2); }
.src:hover { border-color: var(--line-hover); color: var(--ink); }

.card { background: transparent; border: 0; border-radius: 0; overflow: visible; }
.card.cur { background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-lg); overflow: hidden; }
[data-theme="light"] .card.cur { background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04); }
.chead { padding: 14px 16px 0; }
.chead .k { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.card:not(.cur) .chead { padding: 0 0 6px; }
.stitle { padding: 4px 16px 0; font-size: 15px; font-weight: 600; letter-spacing: -0.009em; }
.cbody { padding: 12px 16px 14px; gap: 12px; }
textarea, input.text { border-radius: var(--r); background: var(--field); border: 1px solid var(--line-strong); font-size: 14px; line-height: 22px; }
textarea:focus, input.text:focus { border-color: var(--accent); background: var(--field); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.draft { min-height: 88px; padding: 10px 12px; }
.why { font-size: 14px; line-height: 22px; }
.checkline { margin: 8px 16px 0; padding: 5px 10px; font-size: 12px; border-radius: var(--r-sm); }
.checkline.warn { background: color-mix(in srgb, var(--warn) 10%, transparent); }
.checkline.block { background: var(--bad-bg); }

.upcoming { margin-top: 0; }
.up { padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 14px; color: var(--ink-2); gap: 12px; }
.up:first-child { border-top: 0; }
.up.done { color: var(--ink-3); text-decoration: none; }
.donebtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: var(--ink-3); }
.donebtn:hover { color: var(--ink); }
.check { width: 15px; height: 15px; border: 1.5px solid var(--ink-4); }
.check.done { background: transparent; border-color: var(--ink-4); color: var(--ink-3); }

const CFG = /*BRAIN_CONFIG*/{};  // config/brain.json (public fields), filled in by app/server.py
const OWNER = CFG.owner_token || "me";
// Every /api call carries this launch's token (app/server.py refuses calls without it).
const _fetch = window.fetch.bind(window);
window.fetch = (u, o = {}) => typeof u === "string" && u.startsWith("/api/") ? _fetch(u, { ...o, headers: { ...(o.headers || {}), "X-Brain-Token": CFG.token } }) : _fetch(u, o);

async function load(force) {

}

    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }

}

// Native title tooltips wait about a second and look like the OS. Move each title into data-tip on first hover and
// show ours after 150ms; hide on leave, click, key or scroll.
(() => {
  const tip = document.createElement("div"); tip.id = "tip"; document.body.appendChild(tip);
  let timer = null, cur = null;
  const hide = () => { clearTimeout(timer); timer = null; cur = null; tip.classList.remove("show"); };
  const place = el => {
    const r = el.getBoundingClientRect(); tip.style.left = "0px"; tip.style.top = "0px";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let top = r.top - h - 8; if (top < 6) top = r.bottom + 8;
    const left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  };
  document.addEventListener("pointerover", e => {
    let el = e.target.closest?.("[title], [data-tip]");
    const kb = e.target.closest?.(".btn");
    if (kb && !el && kb.querySelector("kbd")) {  // a button whose key hint is hidden: show "Label (key)" on hover
      const k = kb.querySelector("kbd").textContent.trim(), label = kb.textContent.replace(k, "").replace(/\s+/g, " ").trim();
      kb.dataset.tip = `${label} (${k})`; el = kb;
    }
    if (!el || el === cur) return;
    if (el.hasAttribute("title")) { const t = el.getAttribute("title"); el.removeAttribute("title"); if (t) el.dataset.tip = t; }
    const text = el.dataset.tip; if (!text) return;
    hide(); cur = el;
    timer = setTimeout(() => { if (cur !== el || !el.isConnected) return; tip.textContent = text; place(el); tip.classList.add("show"); }, 150);
  });
  document.addEventListener("pointerout", e => { if (cur && !cur.contains(e.relatedTarget)) hide(); });
  ["pointerdown", "keydown", "scroll", "blur"].forEach(ev => addEventListener(ev, hide, true));
})();

    if (c.discovery === "failed" || (c.added && !c.tools)) return `<button class="btn sm" data-conn-retry="${esc(c.name)}" title="${c.state !== "connected" ? "Connect it first, then retry" : "Find its read tools again"}">Retry</button>`;
    return `<button class="btn ghost sm" data-conn-set="${esc(c.name)}">${icon("pen")}Settings</button>`;
  };
  const scroll = $("detail").scrollTop, hadFocus = document.activeElement?.id === "conn-q";
  $("detail").innerHTML = `<div class="page conn">
    <div class="h">Connectors</div>
    ${claudeCard(r.claude)}
    <div class="cmine"><span class="mp-k">In your brain (${mine.length})</span><div class="cchips">${mine.map(chip).join("") || '<span class="muted">None yet</span>'}</div></div>
    <div class="cbar"><input class="text" id="conn-q" placeholder="Search connectors" value="${esc(C.q)}"><button class="btn sm" data-conn-refresh ${r.checking ? "disabled" : ""}>${r.checking ? "Checking…" : "Check status"}</button></div>
    <div class="clist">${rows.map(c => { const [k, l] = STATE[c.state] || STATE.not_connected; return `<div class="crow ${c.added ? "on" : ""}">
      <span class="clogo">${esc(c.name[0])}</span>
      <div class="cmain"><div class="cname">${esc(c.name)}<span class="ccat">${esc(c.category || "")}</span></div>${c.added ? connSummary(c) : ""}</div>
      <span class="cstate"><span class="rd ${k}"></span>${l}</span>
      ${c.state !== "connected" ? `<a class="btn ghost sm" href="${safeUrl(r.connect_url)}" target="_blank" rel="noopener" title="Sign in to ${esc(c.name)} at claude.ai">Connect</a>` : ""}
      ${action(c)}</div>`; }).join("") || '<div class="muted">No connector matches.</div>'}</div>
    <div class="muted" style="font-size:12px">Order is an estimate of how widely Claude users connect each one. ${r.checked_at ? "Status checked " + esc(fmtTs(r.checked_at)) + "." : ""}</div>
  </div>`;
  $("detail").scrollTop = scroll;
  if (hadFocus) { const i = $("conn-q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
const ROLE = { watch: ["Watch", "Lead runs read it for new work, each since it was last read."], lookup: ["Lookup", "Read only when an item, link or agent needs it. Cheapest."], off: ["Off", "Kept, but no run reads it."] };
function claudeCard(cl) {
  const head = `<span class="clogo">C</span>`;
  if (!cl) return `<div class="claude">${head}<div class="cmain"><div class="cname">Claude</div><div class="cabout">Checking your Claude sign-in…</div></div></div>`;
  if (!cl.installed) return `<div class="claude">${head}<div class="cmain"><div class="cname">Claude Code isn't installed</div><div class="cabout">The brain runs on your own Claude Code. Install it from claude.com/claude-code, sign in, then check again.</div></div><button class="btn sm" data-conn-refresh>Check again</button></div>`;
  if (!cl.logged_in) return `<div class="claude">${head}<div class="cmain"><div class="cname">Claude isn't signed in <span class="chip warn">Runs paused</span></div><div class="cabout">Run <code>claude auth login</code> in Terminal and sign in with your Claude account (any paid plan) or an Anthropic Console account. Then check again.</div></div><button class="btn sm" data-conn-refresh>Check again</button></div>`;
  const how = cl.method === "claude.ai" ? `${esc(cl.plan ? cl.plan[0].toUpperCase() + cl.plan.slice(1) : "Claude")} plan` : cl.provider && cl.provider !== "firstParty" ? esc(cl.provider) : "API key";
  return `<div class="claude">${head}<div class="cmain"><div class="cname">Claude<span class="ccat">Claude Code ${esc(cl.version || "")}</span></div>
    <div class="cabout">Signed in as ${esc(cl.account || "")}${cl.org ? " · " + esc(cl.org) : ""} · ${how}</div></div>
    <span class="cstate"><span class="rd ok"></span>Signed in</span></div>`;
}
function connSummary(c) {
  if (!c.role) return "";
  const st = c.stats || {};
  const bits = [ROLE[c.role][0] + (c.role === "watch" ? (c.cadence === "daily" ? " once a day" : " every run") : ""), c.areas?.length ? c.areas.join(", ") : "",
    st.items ? `${st.items} items this week` : ""].filter(Boolean);
  return `<div class="cset">${bits.map(esc).join(" · ")}${c.suggest_lookup ? ` <span class="chip warn" data-conn-quiet="${esc(c.name)}" title="No items from it in 7 days">Quiet: switch to Lookup?</span>` : ""}</div>`;
}
function renderSheet() {
  const C = state.conn, c = connFind(C.open), d = C.draft, areas = C.data?.areas || [];
  if (!c || !d) { $("csheet").classList.remove("show"); return; }
  const t = c.test, testing = (C.data?.testing || []).includes(c.server) || t?.status === "running";
  $("csheet-body").innerHTML = `<div class="h">${esc(c.name)}</div>
    <div class="cs-row"><span class="cs-k">Role</span><div class="seg">${Object.keys(ROLE).map(k => `<button data-cs-role="${k}" class="${d.role === k ? "on" : ""}">${ROLE[k][0]}</button>`).join("")}</div><span class="cs-help">${esc(ROLE[d.role][1])}</span></div>
    <div class="cs-row"><span class="cs-k">${d.role === "watch" ? "What to watch" : "What it's for"}</span><textarea id="cs-use" rows="2">${esc(d.use)}</textarea><span class="cs-help">Plain words. Channels, folders or teams per area go in that area's lead spec.</span></div>
    ${d.role === "watch" ? `<div class="cs-row"><span class="cs-k">How often</span><div class="seg"><button data-cs-cad="every" class="${d.cadence !== "daily" ? "on" : ""}">Every lead run</button><button data-cs-cad="daily" class="${d.cadence === "daily" ? "on" : ""}">Once a day</button></div><span class="cs-help">Lead runs follow your schedule, inside working hours. Each read covers everything since this connector was last read.</span></div>
      <label class="cs-req"><input type="checkbox" id="cs-req" ${d.required ? "checked" : ""}> Wait for it to connect before a run starts</label>` : ""}
    ${areas.length > 1 ? `<div class="cs-row"><span class="cs-k">Areas</span><div class="cs-areas">${areas.map(a => `<label><input type="checkbox" data-cs-area="${esc(a)}" ${!d.areas.length || d.areas.includes(a) ? "checked" : ""}> ${esc(a)}</label>`).join("")}</div></div>` : ""}
    <div class="cs-test"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="cs-k">Test read</span>
      <button class="btn sm" data-cs-test ${testing || !c.tools ? "disabled" : ""}>${testing ? "Reading…" : t ? "Run again" : "Run a test read"}</button></div>
      <span class="cs-help">${c.tools ? "Reads the last 48 hours and shows what would become an item. Nothing is queued." : "Available once it has found its read tools."}</span>
      ${t && t.status === "done" ? `<div>${esc(t.read || "")}</div>${t.items?.length ? `<ol>${t.items.map(x => `<li>${esc(x.title)}<div class="why">${esc(x.why || "")}${x.source ? " · " + esc(x.source) : ""}</div></li>`).join("")}</ol>` : `<div class="muted">Nothing would become an item.</div>`}${t.suggestion ? `<div class="cs-help">${esc(t.suggestion)}</div>` : ""}` : ""}</div>
    <div class="actions"><button class="btn ghost" data-cs-remove>Remove</button><span style="flex:1"></span><button class="btn ghost" data-cs-cancel>Cancel</button><button class="btn primary" data-cs-save>Save</button></div>`;
  $("csheet").classList.add("show");
}
function openSheet(name) {
  const c = connFind(name); if (!c) return;
  state.conn.open = name; state.conn.draft = { role: c.role || "watch", cadence: c.cadence || "every", areas: [...(c.areas || [])], required: !!c.required, use: c.use || "" };
  renderSheet();
}
const closeSheet = () => { state.conn.open = state.conn.draft = null; $("csheet").classList.remove("show"); };
$("csheet").addEventListener("click", async e => {
  const C = state.conn, d = C.draft, c = connFind(C.open), q = s => e.target.closest(s); let el;
  if (!d || !c) return;
  if (e.target.id === "csheet" || q("[data-cs-cancel]")) return closeSheet();
  d.use = $("cs-use")?.value ?? d.use; if ($("cs-req")) d.required = $("cs-req").checked;
  if ((el = q("[data-cs-role]"))) { d.role = el.dataset.csRole; return renderSheet(); }
  if ((el = q("[data-cs-cad]"))) { d.cadence = el.dataset.csCad; return renderSheet(); }
  if (q("[data-cs-area]")) { const all = [...document.querySelectorAll("[data-cs-area]")]; d.areas = all.every(x => x.checked) ? [] : all.filter(x => x.checked).map(x => x.dataset.csArea); return; }
  if (q("[data-cs-test]")) { const area = (d.areas[0] || CFG.default_area || C.data?.areas?.[0]); if (await connPost("test", { name: c.name, server: c.server, area })) { c.test = { status: "running" }; renderSheet(); } return; }
  if (q("[data-cs-remove]")) { if (confirm(`Remove ${c.name} from your brain? Runs stop reading it.`) && await connPost("remove", { name: c.name, server: c.server })) { closeSheet(); renderConnectors(); } return; }
  if (q("[data-cs-save]")) { if (await connPost("settings", { name: c.name, server: c.server, ...d, required: d.role === "watch" && d.required })) { toast(icon("check") + `${esc(c.name)} saved`); closeSheet(); renderConnectors(); } }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("csheet").classList.contains("show")) { e.stopPropagation(); closeSheet(); } }, true);
const connPost = async (a, body) => { const r = await fetch("/api/connectors/" + a, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) toast(esc(j.error || "Didn't work"), true); return r.ok; };
const connFind = n => state.conn.data?.connectors.find(c => c.name === n);
document.addEventListener("input", e => { if (e.target.id === "conn-q") { state.conn.q = e.target.value; renderConnectors(); } });
document.addEventListener("click", async e => {
  if (state.view !== "connectors") return;
  const q = s => e.target.closest(s); let el;
  if ((el = q("[data-conn-add]"))) { const c = connFind(el.dataset.connAdd); el.disabled = true; if (await connPost("add", { name: c.name, server: c.server, use: c.use })) { toast(icon("plug") + `${esc(c.name)} added; finding its read tools`); await renderConnectors(); openSheet(c.name); return; } return renderConnectors(); }
  if ((el = q("[data-conn-set]"))) return openSheet(el.dataset.connSet);
  if ((el = q("[data-conn-quiet]"))) { const c = connFind(el.dataset.connQuiet); if (await connPost("settings", { name: c.name, server: c.server, role: "lookup" })) { toast(icon("check") + `${esc(c.name)} is now Lookup`); renderConnectors(); } return; }
  if ((el = q("[data-conn-retry]"))) { const c = connFind(el.dataset.connRetry); await connPost("retry", { name: c.name, server: c.server }); return renderConnectors(); }
  if (q("[data-conn-refresh]")) { await connPost("refresh", { server: "all" }); return setTimeout(renderConnectors, 300); }
});
setInterval(() => { const d = state.conn.data; if (state.view === "connectors" && document.visibilityState === "visible" && d && (d.checking || d.testing?.length || d.connectors.some(c => c.discovery === "pending" || c.test?.status === "running"))) renderConnectors().then(() => state.conn.open && renderSheet()); }, 3000);
</script>
